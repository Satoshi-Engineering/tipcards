install:
  stage: .pre # always first, no matter if it is listed in stages
  rules:
    - !reference [.shared_config, rules, no_tags]
    - changes:
      - package-lock.json
      - .gitlab-ci.yml
      - gitlab-ci/.shared_config.yml
      - gitlab-ci/install.yml
  cache:
    - !reference [.shared_config, cache, npm]
    - key:
        files:
          - package-lock.json
        prefix: node_modules-bookworm
      paths:
        - node_modules/
      when: on_success
      policy: pull-push
  script:
    - if ! [[ -d node_modules ]]; then npm ci --cache .npm --prefer-offline; fi
